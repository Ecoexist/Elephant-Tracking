<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body.app {
    margin:0;
    display:flex;
    min-height:100vh;
    font-family:sans-serif;
}

/* sidebar */
.sidebar {
    width:190px;
    background:#4C1918;
    color:white;
    padding:10px;
}

/* main */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

#map {
    flex:1;
    background:#000;
}

.loading {
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    flex-direction:column;
}
</style>

<script>
/* ---------------- AUTH ---------------- */
(async function(){
    try{
        const r = await window.AuthPortal.checkAuthAndRedirect(false,'lightmap_100m.html');
        if(r && r.role!=='admin'){
            window.location='dashboard_public_firebase.html';
        }
    } catch(e){
        window.location='login.html?return=lightmap_100m.html';
    }

    function init(){
        const o=document.getElementById('auth');
        if(o) o.remove();
        window.dispatchEvent(new Event('authReady'));
        if(window.runAfterAuth) window.runAfterAuth();
    }

    document.addEventListener('DOMContentLoaded',init);
})();
</script>
</head>

<body class="app">

<div id="auth" class="loading">Checking auth…</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <h5>Ecoexist</h5>
    <a href="dashboard_all_data.html">Map</a><br>
    <a href="lightmap_100m.html">Light map</a>
</div>

<!-- MAIN -->
<div class="main">
    <div id="map"></div>
</div>

<script>
/* ---------------- CONFIG ---------------- */
const API = "https://ecoexist-api.vercel.app/api/awt-data";
const CELL = 100;
const R = 6378137;

/* 🔑 YOUR thresholds */
const USE_T = 50;
const SPEED_T = 1.0;
const DIR_T = 0.9;

/* ---------------- MAP ---------------- */
let map;

/* ---------------- UTILS ---------------- */
function mXY(lat,lon){
    return {
        x:R*(lon*Math.PI/180),
        y:R*Math.log(Math.tan(Math.PI/4+(lat*Math.PI/180)/2))
    };
}

function havKm(a,b,c,d){
    const R=6371;
    const d1=(c-a)*Math.PI/180;
    const d2=(d-b)*Math.PI/180;
    const x=Math.sin(d1/2)**2 +
            Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
            Math.sin(d2/2)**2;
    return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function cells(x0,y0,x1,y1){
    const s=new Set();
    const dx=x1-x0,dy=y1-y0;
    const n=Math.max(2,Math.ceil(Math.hypot(dx,dy)/25));

    for(let i=0;i<=n;i++){
        const t=i/n;
        const x=x0+t*dx;
        const y=y0+t*dy;
        s.add(Math.floor(x/CELL)+","+Math.floor(y/CELL));
    }
    return s;
}

/* ---------------- CORE ---------------- */
function runModel(points){

    const grid=new Map();
    const byTag=new Map();

    function get(k){
        if(!grid.has(k)){
            grid.set(k,{
                count:0,
                speed:0,
                n:0,
                ux:0,
                uy:0,
                nd:0
            });
        }
        return grid.get(k);
    }

    /* points */
    points.forEach(p=>{
        const xy=mXY(p.lat,p.lon);
        const k=Math.floor(xy.x/CELL)+","+Math.floor(xy.y/CELL);
        get(k).count++;

        if(!byTag.has(p.tag)) byTag.set(p.tag,[]);
        byTag.get(p.tag).push(p);
    });

    /* segments */
    byTag.forEach(arr=>{
        arr.sort((a,b)=>a.ts-b.ts);

        for(let i=0;i<arr.length-1;i++){
            const A=arr[i],B=arr[i+1];
            const dt=B.ts-A.ts;
            if(dt<=0||dt>6*3600) continue;

            const d=havKm(A.lat,A.lon,B.lat,B.lon);
            const sp=(d/dt)*3600;
            if(sp<=0||sp>200) continue;

            const m0=mXY(A.lat,A.lon);
            const m1=mXY(B.lat,B.lon);

            const dx=m1.x-m0.x;
            const dy=m1.y-m0.y;
            const len=Math.hypot(dx,dy);
            if(!len) continue;

            const ux=dx/len;
            const uy=dy/len;

            const cc=cells(m0.x,m0.y,m1.x,m1.y);

            cc.forEach(k=>{
                if(!grid.has(k)) return;
                const g=grid.get(k);

                g.speed+=sp;
                g.n++;

                g.ux+=ux;
                g.uy+=uy;
                g.nd++;
            });
        }
    });

    /* finalize */
    const out=[];

    grid.forEach((g,k)=>{

        const avg=g.n?g.speed/g.n:null;

        let dir=null;
        if(g.nd){
            const mag=Math.sqrt(g.ux*g.ux+g.uy*g.uy);
            dir=mag/g.nd;
        }

        if(
            g.count>=USE_T &&
            avg>=SPEED_T &&
            dir>=DIR_T
        ){
            out.push({k,count:g.count,speed:avg,dir});
        }
    });

    return out;
}

/* ---------------- DRAW ---------------- */
function draw(cells){

    cells.forEach(c=>{
        const [ix,iy]=c.k.split(',').map(Number);

        const a=mXY(0,0); // dummy origin helper not needed for real display
        const x0=ix*CELL;
        const y0=iy*CELL;

        const p1=inv(x0,y0);
        const p2=inv(x0+CELL,y0+CELL);

        L.rectangle([[p1.lat,p1.lon],[p2.lat,p2.lon]],{
            color:"#fff",
            fillColor:"#fff",
            fillOpacity:1
        })
        .bindPopup(
            "Use: "+c.count+
            "<br>Speed: "+c.speed.toFixed(2)+
            "<br>Dir: "+c.dir.toFixed(2)
        )
        .addTo(map);
    });

    function inv(x,y){
        return {
            lon:(x/R)*(180/Math.PI),
            lat:(2*Math.atan(Math.exp(y/R))-Math.PI/2)*(180/Math.PI)
        };
    }
}

/* ---------------- LOAD DATA ---------------- */
async function load(){

    const token=await window.firebasePortal.auth.currentUser.getIdToken();

    const r=await fetch(API,{
        headers:{Authorization:"Bearer "+token}
    });

    const data=await r.json();

    map=L.map("map").setView([-19,22.5],10);

    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    ).addTo(map);

    L.rectangle([[-85,-180],[85,180]],{
        fillColor:"#000",
        fillOpacity:0.7,
        stroke:false
    }).addTo(map);

    const result=runModel(data);

    draw(result);

    document.getElementById("auth").style.display="none";
}

/* ---------------- BOOT ---------------- */
window.runAfterAuth=load;
document.addEventListener("authReady",load);
</script>

</body>
</html>
