<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngamiland LUCIS - Ecoexist</title>
    <link rel="icon" type="image/svg+xml" href="data/icons/Ecoexist.svg">
    <link rel="icon" type="image/png" href="data/icons/Ecoexist_icon.png">
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/auth-portal.js"></script>
    <script>
      (async function() {
        try {
          const result = await window.AuthPortal.checkAuthAndRedirect(false, 'ngamiland-lucis.html');
          if (!result || !window.AuthPortal.canAccessPortalPage(result.role, result.allowedPages, 'ngamiland-lucis.html')) {
            window.location.replace('login.html?return=ngamiland-lucis.html');
            return;
          }
        } catch (e) {
          window.location.replace('login.html?return=ngamiland-lucis.html');
          return;
        }
        function finish() {
          document.getElementById('auth-overlay')?.remove();
          if (window.AuthPortal && window.AuthPortal.applyRibbonNavForUser) {
            window.AuthPortal.applyRibbonNavForUser({ currentPage: 'ngamiland-lucis.html' });
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', finish);
        } else {
          finish();
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .embed-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .embed-container iframe { flex: 1; width: 100%; border: none; min-height: 600px; }
    </style>
</head>
<body>
    <div id="auth-overlay" style="position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;color:#333;">Checking authentication...</div>
    <style>html.embed-mode .top-ribbon{display:none!important}html.embed-mode .main-content{margin-top:0!important}</style>
    <script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed-mode');</script>
    <div class="top-ribbon">
        <h1 style="display: flex; align-items: center; gap: 10px;">
            <img src="data/icons/Ecoexist.svg" alt="" style="width: 48px; height: 48px; flex-shrink: 0;">
            Ngamiland LUCIS
        </h1>
        <div id="portal-ribbon-nav" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;"></div>
    </div>
    <div class="main-content" style="overflow: hidden;">
        <div class="embed-container">
            <iframe src="https://ecoexist.maps.arcgis.com/apps/dashboards/ac4895422fb14fea9aef73f381aa6197" title="Ngamiland LUCIS Dashboard"></iframe>
        </div>
    </div>
</body>
</html>
