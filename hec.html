<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEC - Ecoexist</title>
    <link rel="icon" type="image/svg+xml" href="data/icons/Ecoexist.svg">
    <link rel="icon" type="image/png" href="data/icons/Ecoexist_icon.png">
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/auth-portal.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
        .embed-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .embed-container iframe { flex: 1; width: 100%; border: none; min-height: 600px; }
    </style>
    <script>
      (async function() {
        try {
          const result = await window.AuthPortal.checkAuthAndRedirect(false, 'hec.html');
          if (!result || !window.AuthPortal.canAccessPortalPage(result.role, result.allowedPages, 'hec.html')) {
            window.location.replace('login.html?return=hec.html');
            return;
          }
        } catch (e) {
          window.location.replace('login.html?return=hec.html');
          return;
        }
        function doInit() {
          var overlay = document.getElementById('auth-overlay');
          if (overlay) overlay.remove();
          window.dispatchEvent(new CustomEvent('authReady'));
          if (typeof window.runAfterAuth === 'function') window.runAfterAuth();
          if (window.AuthPortal && window.AuthPortal.applySidebarNavForUser) {
            window.AuthPortal.applySidebarNavForUser({ currentPage: 'hec.html' }).catch(function (e) {
              console.warn(e);
            });
          }
          if (typeof window.wirePortalShellUi === 'function') window.wirePortalShellUi();
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', doInit);
        } else {
          doInit();
        }
      })();
    </script>
</head>
<body class="app-layout-corridor">
    <div id="auth-overlay" style="position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;color:#333;">Checking authentication...</div>
    <style>html.embed-mode .app-sidebar,html.embed-mode .user-avatar-float,html.embed-mode .corridor-page-header{display:none!important}html.embed-mode .main-content{margin-top:0!important}</style>
    <script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed-mode');</script>

    <div class="dropdown user-avatar-float">
        <button type="button" class="user-avatar-btn" id="userAvatarMenuBtn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu" aria-haspopup="true">
            <span id="userAvatarInitials">··</span>
            <span class="user-status-dot" aria-hidden="true"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userAvatarMenuBtn">
            <li><a class="dropdown-item" href="#" id="userAvatarSignOut">Log out</a></li>
        </ul>
    </div>

    <aside class="app-sidebar" aria-label="Main navigation">
        <div class="app-sidebar-inner">
            <a href="dashboard_all_data.html" class="app-sidebar-logo" title="Ecoexist home">
                <img src="data/icons/Ecoexist.svg" alt="Ecoexist">
            </a>
            <nav class="app-sidebar-nav"></nav>
        </div>
    </aside>

    <div class="app-main-wrap">
        <header class="corridor-page-header">
            <h1 class="corridor-page-heading">HEC</h1>
        </header>
        <div class="main-content" style="overflow: hidden;">
            <div class="embed-container">
                <iframe src="https://ecoexist.maps.arcgis.com/apps/dashboards/483588925bf84aaa988fb0f077fba05a" title="HEC Dashboard"></iframe>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/portal-app-shell.js"></script>
</body>
</html>
